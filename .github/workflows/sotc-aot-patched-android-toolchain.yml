name: SotC patched ARM64 AOT compiler for in-app rebuild (no TSO)
on:
  push:
    branches: [experiment/sotc-arm64-aot-no-tso-055]
    paths: ['.github/workflows/sotc-aot-patched-android-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 68
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android NDK, tools and storage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake zstd libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          echo "BB_NDK=$ndk" >> "$GITHUB_ENV"
          echo 'BB_JOBS=4' >> "$GITHUB_ENV"
          df -h /
      - name: Download source and host LLVM 23.1.3 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ducvd89/Bloodborne-android-rebuild-tool.git /tmp/sotc-bbrecomp-src
          test "$(git -C /tmp/sotc-bbrecomp-src rev-parse HEAD | cut -c 1-9)" = 6ebb33b0c
          compiler=/tmp/sotc-bbrecomp-src
          bash "$compiler/fetch-fex.sh"
          python3 ports/sotc/android/aot/patch_bbrecomp_lowering.py "$compiler"
          deps="$compiler/.local-deps"
          mkdir -p "$deps/llvm/dl" "$deps/llvm/x" "$deps/llvm/src" "$deps/deps/dl" "$deps/mimalloc"
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst' \
            -o "$deps/llvm/dl/LLVM-23.1.3-Linux-X64.tar.zst"
          zstd -d --long=31 -c "$deps/llvm/dl/LLVM-23.1.3-Linux-X64.tar.zst" | tar -x -C "$deps/llvm/x"
          test -x "$deps/llvm/x/LLVM-23.1.3-Linux-X64/bin/clang"
          curl -fL --retry 3 --connect-timeout 30 --max-time 450 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/llvm-project-23.1.3.src.tar.xz' \
            -o /tmp/sotc-llvm-src.tar.xz
          tar -xf /tmp/sotc-llvm-src.tar.xz -C "$deps/llvm/src"
          test -d "$deps/llvm/src/llvm-project-23.1.3.src/llvm"
          curl -fL --retry 3 --connect-timeout 30 --max-time 120 \
            'https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz' -o "$deps/deps/dl/zlib-1.3.1.tar.xz"
          curl -fL --retry 3 --connect-timeout 30 --max-time 120 \
            'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz' -o "$deps/deps/dl/zstd-1.5.7.tar.gz"
          curl -fL --retry 3 --connect-timeout 30 --max-time 120 \
            'https://github.com/microsoft/mimalloc/archive/refs/tags/v3.6.0.tar.gz' -o /tmp/sotc-mimalloc.tar.gz
          tar -xf /tmp/sotc-mimalloc.tar.gz -C "$deps/mimalloc"
          test -f "$deps/mimalloc/mimalloc-3.6.0/src/static.c"
          echo "BB_X86_DEPS=$deps" >> "$GITHUB_ENV"
          echo "BB_FEX_TREE=$compiler/out/recomp-fex" >> "$GITHUB_ENV"
          df -h /
      - name: Compile LLVM+LLD and patched bb-recomp as Android Bionic arm64 PIE
        shell: bash
        run: |
          set -euo pipefail
          compiler=/tmp/sotc-bbrecomp-src
          bash "$compiler/arm64/build.sh" android
          test -x "$compiler/out/android-ndk/bb-recomp"
          file "$compiler/out/android-ndk/bb-recomp"
      - name: Verify ELF, AOT patch identity, and prepare library for APK JNI
        shell: bash
        run: |
          set -euo pipefail
          tool=/tmp/sotc-bbrecomp-src/out/android-ndk/bb-recomp
          readelf -h "$tool" | grep -F AArch64
          readelf -l "$tool" | grep -F '/system/bin/linker64'
          strings "$tool" | grep -Fq 'SOTC_AOT_MASKED_SSE42_NO_TSO_1'
          mkdir -p out/arm64-sotc-patched-compiler
          install -m 755 "$tool" out/arm64-sotc-patched-compiler/libbbrecomp.so
          sha256sum out/arm64-sotc-patched-compiler/libbbrecomp.so > out/arm64-sotc-patched-compiler/sotc-patched-compiler.sha256
          echo 'SOTC_AOT_MASKED_SSE42_NO_TSO_1' > out/arm64-sotc-patched-compiler/patch-version.txt
          file out/arm64-sotc-patched-compiler/libbbrecomp.so
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-bbrecomp-android-aarch64-native-simd-sse42
          path: out/arm64-sotc-patched-compiler/
          retention-days: 5
          if-no-files-found: error
