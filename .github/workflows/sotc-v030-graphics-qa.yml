name: SotC v0.1.30 complete graphics draw preflight
on:
  push:
    branches: [fix/sotc-v030-complete-draws-a830-20261101]
    paths:
      - ports/sotc/android/stage_renderer.py
      - tests/test_sotc_render_completeness.py
      - .github/workflows/sotc-v030-graphics-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Local tests
        run: |
          python3 -m py_compile ports/sotc/android/stage_renderer.py
          python3 -m unittest discover -s tests -p 'test_sotc_render_completeness.py' -v
      - name: Pin upstream SotC renderer
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/AjncSystem/ShadowOfTheColossus-PC.git upstream-sotc
          git -C upstream-sotc fetch --depth 1 origin 27f376d602cefad357299295fa51edad587272d5
          git -C upstream-sotc checkout --detach FETCH_HEAD
          git -C upstream-sotc submodule update --init --recursive --depth 1
      - name: Stage real renderer and verify every graphics draw is preserved
        run: |
          python3 ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          python3 - <<'PY'
          from pathlib import Path
          s=Path("out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_cache.cpp").read_text()
          assert "static bool RequireCompleteGraphicsDraws()" in s
          assert "#ifdef __ANDROID__\n    return true;\n#else" in s
          assert "async_translate_ok = !RequireCompleteGraphicsDraws()" in s
          assert "if (queued && liverpool->regs.num_indices > 6 && !RequireCompleteGraphicsDraws())" in s
          assert "if (!RequireCompleteGraphicsDraws() && !async_workers.empty() && !tiny_draw" in s
          assert "if (!async_workers.empty() && !tiny_draw && eligible && !queued)" not in s
          assert "const bool deferred = !async_workers.empty() && AsyncComputeEnabled()" in s
          print("PASS: Android graphics draws never skipped by pending shader or pipeline, async compute stays available")
          PY
