name: GoW3 2.1.8 Mali G615 memory and sync preflight (NO APK)

on:
  push:
    branches: [fix/gow3-218-panvk-g615-freeze-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PanVK-only safety defaults and backed arena contract
        run: |
          sh -n tools/android/bionic/run-bionic.sh
          python -m unittest discover -s tests -p 'test_sparse_queue.py' -v
          python -m unittest discover -s tests -p 'test_mali_panvk_safe_mode.py' -v
          python -m unittest discover -s tests -p 'test_android_driver_selection.py' -v
          python -m unittest discover -s tests -p 'test_scheduler_chunk.py' -v
