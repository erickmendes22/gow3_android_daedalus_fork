name: SotC Android native preboot checks
on:
  push:
    branches: [sotc-android-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: AjncSystem/ShadowOfTheColossus-PC
          ref: 27f376d602cefad357299295fa51edad587272d5
          path: upstream-sotc
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate upstream and local preparation
        run: |
          for s in prepare.py link_modules.py content_profile.py sotc_cpu.py sotc_modes.py; do
            test -s "upstream-sotc/scripts/$s"
          done
          python -m py_compile ports/sotc/android/prepare_game.py
          python -m unittest discover -s tests -p 'test_sotc_*.py' -v
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Validate actual SotC HLE on ARM64
        run: |
          sdkmanager 'ndk;29.0.14206865'
          ndk="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p out/sotc-android
          "$ndk/bin/aarch64-linux-android30-clang" -std=c11 -O2 -Wall -Wextra -Werror -fPIC -Isrc -c src/runtime_sotc.c -o out/sotc-android/runtime_sotc.o
          "$ndk/bin/aarch64-linux-android30-clang" -std=c11 -O2 -Wall -Wextra -Werror -fPIC -I. -Isrc -c src/probe.c -o out/sotc-android/probe.o
          "$ndk/bin/aarch64-linux-android30-clang" -std=c11 -O2 -Wall -Wextra -Werror -fPIC -I. -Isrc -c src/runtime.c -o out/sotc-android/runtime.o
          "$ndk/bin/aarch64-linux-android30-clang" -std=c11 -O2 -Wall -Wextra -Werror -fPIC -I. -Isrc -c src/runtime_fiber.c -o out/sotc-android/runtime_fiber.o
          "$ndk/bin/llvm-readelf" -h out/sotc-android/runtime_sotc.o | grep -q AArch64
          "$ndk/bin/llvm-readelf" -h out/sotc-android/probe.o | grep -q AArch64
      - name: Stage upstream SotC original renderer for Bionic
        run: |
          python ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          test -s out/sotc-android/gpu/shim/window_android.cpp
          grep -q VK_USE_PLATFORM_ANDROID_KHR out/sotc-android/gpu/CMakeLists.txt
      - name: Compile SotC headless renderer window for ARM64
        run: |
          ndk="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          "$ndk/bin/aarch64-linux-android30-clang++" -std=c++23 -O2 -Wall -Wextra -Werror -Wno-unused-private-field -fPIC \
            -Iupstream-sotc/gpu/shim -Iupstream-sotc/gpu/shadps4 \
            -c ports/sotc/android/window_android.cpp -o out/sotc-android/window_android.o
          "$ndk/bin/llvm-readelf" -h out/sotc-android/window_android.o | grep -q AArch64
      - name: Exercise real SotC NID resolver against original table
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I. -Isrc -c src/runtime.c -o "$RUNNER_TEMP/sotc-runtime.o"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wl,--gc-sections \
            tests/test_sotc_nid_runtime.c "$RUNNER_TEMP/sotc-runtime.o" \
            -o "$RUNNER_TEMP/sotc-nid-test"
          "$RUNNER_TEMP/sotc-nid-test"
      - name: Host test low VA
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror ports/sotc/android/lowmem.c tests/test_sotc_lowmem.c -o /tmp/sotc-lowmem-test
          /tmp/sotc-lowmem-test
      - name: Build native ARM64 component
        run: |
          sdkmanager 'ndk;29.0.14206865'
          ndk="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p out/sotc-android
          "$ndk/bin/aarch64-linux-android30-clang" -std=c11 -O2 -Wall -Wextra -Werror -fPIC -c ports/sotc/android/lowmem.c -o out/sotc-android/lowmem.o
          "$ndk/bin/llvm-ar" rcs out/sotc-android/libsotc-lowmem.a out/sotc-android/lowmem.o
          "$ndk/bin/llvm-readelf" -h out/sotc-android/lowmem.o | grep -q AArch64
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-bionic-lowmem-preboot-only
          path: out/sotc-android/libsotc-lowmem.a
          if-no-files-found: error

  fex-jit:
    name: Build SotC FEX ARM64 guest-context backend
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOW3_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install ARM64 NDK and native build tools
        run: |
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake pkg-config
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Build pinned host headers
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"
      - name: Compile the actual embedded FEX CPU backend with new fiber context API
        shell: bash -el {0}
        run: bash tools/android/bionic/build_cpu.sh
      - name: Verify ARM64 FEX guest-context exports
        run: |
          lib=out/bionic/lib/libgow3cpu.so
          test -s "$lib"
          "$GOW3_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep -q AArch64
          "$GOW3_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$lib" | grep -q guest_context_get
          "$GOW3_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$lib" | grep -q guest_context_set
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-fex-arm64-native-only
          path: out/bionic/lib/libgow3cpu.so
          retention-days: 7
          if-no-files-found: error

  renderer-configure:
    name: Configure original SotC Vulkan renderer for Bionic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOW3_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: AjncSystem/ShadowOfTheColossus-PC
          ref: 27f376d602cefad357299295fa51edad587272d5
          path: upstream-sotc
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up NDK and native build tools
        run: |
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake clang lld pkg-config patchelf glslang-tools
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Build Android native third-party dependencies
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          bash tools/android/bionic/build_deps.sh
      - name: Configure game-specific SotC GPU (not GoW3 GPU)
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          ndk="$GOW3_NDK"
          prefix="$PWD/.local-deps/android/bionic-prefix"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          atomic="$("$llvm/bin/aarch64-linux-android30-clang" -print-file-name=libatomic.a)"
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH CMAKE_PREFIX_PATH
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          cmake -S out/sotc-android/gpu -B out/sotc-android/cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBB_PGO=off -DBB_LTO=OFF \
            -DCMAKE_FIND_ROOT_PATH="$prefix" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -Dpkgcfg_lib_FFMPEG_atomic:FILEPATH="$atomic" \
            "-DCMAKE_PREFIX_PATH=$prefix;$CONDA_PREFIX"
          cmake --build out/sotc-android/cmake --target help | grep -q bbgpu
      - name: Compile original SotC GPU library for ARM64
        shell: bash -el {0}
        run: |
          cmake --build out/sotc-android/cmake --target bbgpu --parallel "${GOW3_JOBS:-2}"
          lib=out/sotc-android/cmake/libbbgpu.so
          test -s "$lib"
          "$GOW3_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep -q AArch64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sotc-vulkan-configure-diagnostics
          path: |
            out/sotc-android/cmake/CMakeFiles/CMakeConfigureLog.yaml
            out/sotc-android/cmake/CMakeCache.txt
          if-no-files-found: ignore
