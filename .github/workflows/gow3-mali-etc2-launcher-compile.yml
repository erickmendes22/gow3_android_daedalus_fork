name: GoW3 Mali ETC2 launcher and localization - compile only, NO APK

on:
  push:
    branches:
      - analysis/gow3-bachata-mali-memory-20261106
    paths:
      - 'android-launcher/app/src/main/java/com/gow3/android/feature/settings/GeneralSettingsScreen.kt'
      - 'android-launcher/app/src/main/res/values/strings.xml'
      - 'android-launcher/app/src/main/res/values-pt-rBR/strings.xml'
      - 'android-launcher/app/src/main/res/values-zh-rCN/strings.xml'
      - 'tools/android/bionic/run-bionic.sh'
      - 'tests/test_mali_bcn_to_etc2.py'
      - '.github/workflows/gow3-mali-etc2-launcher-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Compile resources and Kotlin Bionic launcher, without APK
        run: |
          bash android-launcher/gradlew -p android-launcher \
            :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac \
            -Pgow3Bionic=true --no-daemon --max-workers=2
      - name: Verify automatic Mali ETC2 selection without a launcher switch
        run: |
          python3 -m unittest discover -s tests -p 'test_mali_bcn_to_etc2.py' -v
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('android-launcher/app/src/main/java/com/gow3/android/feature/settings/GeneralSettingsScreen.kt').read_text()
          script = Path('tools/android/bionic/run-bionic.sh').read_text()
          native = Path('gpu/shadps4/video_core/texture_cache/image.cpp').read_text()
          assert 'mali_bcn_to_etc2' not in ui
          assert 'setting mali_bcn_to_etc2' not in script
          assert 'export GOW3_MALI_BCN_TO_ETC2=${GOW3_MALI_BCN_TO_ETC2:-1}' in script
          assert "(!etc2_opt || etc2_opt[0] != '0')" in native
          assert 'instance.IsFormatSupported(target, required)' in native
          assert 'ProbeImageFormat(instance, etc2_info)' in native
          print('Automatic supported-Mali ETC2 selection verified; no UI toggle or APK produced.')
          PY
