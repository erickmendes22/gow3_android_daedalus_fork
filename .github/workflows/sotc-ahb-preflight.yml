name: SotC experimental Android AHB Vulkan staging
on:
  push:
    branches: [sotc-ahb-integration]
permissions:
  contents: read
jobs:
  stage-ahb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: AjncSystem/ShadowOfTheColossus-PC
          ref: 27f376d602cefad357299295fa51edad587272d5
          path: upstream-sotc
          submodules: false
      - name: Check experimental Android AHB native source stage
        run: |
          python3 -m py_compile ports/sotc/android/wire_ahb.py ports/sotc/android/stage_renderer.py
          python3 ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          python3 ports/sotc/android/wire_ahb.py --root . --gpu out/sotc-android/gpu
          test -s out/sotc-android/gpu/shim/gow3_present_client.cpp
          test -s out/sotc-android/gpu/shim/vk_driver_loader.cpp
          test -s out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_swapchain_ahb.cpp
          grep -q 'VK_ANDROID_EXTERNAL_MEMORY_ANDROID_HARDWARE_BUFFER_EXTENSION_NAME' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -q 'sotc_release_queues' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp

  build-ahb:
    name: Compile original SotC renderer with Android AHB/Turnip
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOW3_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: AjncSystem/ShadowOfTheColossus-PC
          ref: 27f376d602cefad357299295fa51edad587272d5
          path: upstream-sotc
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android compiler and shader tools
        run: |
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake clang lld pkg-config patchelf glslang-tools ccache
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - uses: actions/cache/restore@v4
        id: sotc-compiler-cache
        with:
          path: .ccache
          key: sotc-ahb-compiler-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sotc-ahb-compiler-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        id: sotc-native-deps
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
          key: sotc-ahb-native-r29-${{ hashFiles('tools/android/bionic/build_deps.sh', 'ci/environment.yml') }}
      - name: Build SotC Android native libraries
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          bash tools/android/bionic/build_deps.sh
      - uses: actions/cache/save@v4
        if: always() && steps.sotc-native-deps.outputs.cache-hit != 'true'
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
          key: sotc-ahb-native-r29-${{ hashFiles('tools/android/bionic/build_deps.sh', 'ci/environment.yml') }}
      - name: Stage original SotC renderer and AHB presentation
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          python ports/sotc/android/wire_ahb.py --root . --gpu out/sotc-android/gpu
          ndk="$GOW3_NDK"
          prefix="$PWD/.local-deps/android/bionic-prefix"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          atomic="$("$llvm/bin/aarch64-linux-android30-clang" -print-file-name=libatomic.a)"
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH CMAKE_PREFIX_PATH
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_MAXSIZE=1600M CCACHE_NOHASHDIR=true
          cmake -S out/sotc-android/gpu -B out/sotc-android/cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBB_PGO=off -DBB_LTO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH="$prefix" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -Dpkgcfg_lib_FFMPEG_atomic:FILEPATH="$atomic" \
            "-DCMAKE_PREFIX_PATH=$prefix;$CONDA_PREFIX"
          cmake --build out/sotc-android/cmake --target bbgpu --parallel "$GOW3_JOBS"
          lib=out/sotc-android/cmake/libbbgpu.so
          test -s "$lib"
          "$llvm/bin/llvm-readelf" -h "$lib" > "$RUNNER_TEMP/sotc-elf-header.txt"
          grep -Fq AArch64 "$RUNNER_TEMP/sotc-elf-header.txt"
          "$llvm/bin/llvm-nm" -D "$lib" > "$RUNNER_TEMP/sotc-elf-symbols.txt"
          grep -Fq bbgpu_init "$RUNNER_TEMP/sotc-elf-symbols.txt"
      - uses: actions/cache/save@v4
        if: always() && steps.sotc-compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: sotc-ahb-compiler-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sotc-vulkan-ahb-arm64-native
          path: out/sotc-android/cmake/libbbgpu.so
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sotc-ahb-native-configure-diagnostics
          path: |
            out/sotc-android/cmake/CMakeCache.txt
            out/sotc-android/cmake/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
