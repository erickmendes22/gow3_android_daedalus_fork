name: SotC 0.1.39 — verified 0.1.34 + four optional 0.1.35 tests
on:
  push:
    branches: [fix/sotc-034-plus-four-optin-039]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sotc-simple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 0.1.34 fastpaths and four disabled options
        run: |
          python3 -m unittest discover -s tests -p test_sotc_base034_four_optin_039.py -v
          python3 -m py_compile ports/sotc/android/repack_base034_optin_039.py
          bash -n ports/sotc/android/run-sotc-bionic.sh
          # Exact byte-for-byte baseline verification occurs during payload repackage.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Download signed 0.1.34 APK and verify original SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original
          gh run download 41440907025 --repo "$GITHUB_REPOSITORY" \
            --name Shadow-of-the-Colossus-Daedalus-Android-Bionic-0.1.34-sequential-readback --dir original
          (cd original && sha256sum -c Shadow-of-the-Colossus-Daedalus-Android-0.1.34-sequential-readback-arm64.apk.sha256)
      - name: Rebuild Android frontend over byte-identical 0.1.34 runtime
        run: |
          set -euo pipefail
          python3 ports/sotc/android/repack_base034_optin_039.py \
            --base-apk original/Shadow-of-the-Colossus-Daedalus-Android-0.1.34-sequential-readback-arm64.apk --root .
          chmod +x android-launcher/gradlew
          android-launcher/gradlew -p android-launcher :app:assembleRelease \
            -PsotcAndroid=true --no-daemon --max-workers=2
          bash ports/sotc/android/sign_sotc_apk.sh
      - name: Verify the final signed APK contains original native files and settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,tarfile,json
          from zipfile import ZipFile
          p=Path('out/release/Shadow-of-the-Colossus-Daedalus-Android-0.1.39-base034-four-optin-arm64.apk')
          assert p.is_file() and p.stat().st_size>40_000_000
          baseline=Path('out/release/sotc-native-identical-0.1.39.json')
          report=json.loads(baseline.read_text())
          assert set(report['only_changed_runtime_files'])=={'runtime-manifest.json','sotcport/run-sotc-bionic.sh'}
          with ZipFile(p) as z:
              data=z.read('assets/runtime.payload')
              assert hashlib.sha256(data).hexdigest()==z.read('assets/runtime.sha256').decode().strip()
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
                  for name,hash0 in report['all_original_file_sha256'].items():
                      if name in ('runtime-manifest.json','sotcport/run-sotc-bionic.sh'): continue
                      f=archive.extractfile(name)
                      assert f and hashlib.sha256(f.read()).hexdigest()==hash0,name
                  sh=archive.extractfile('sotcport/run-sotc-bionic.sh').read()
                  assert b'SOTC_FLUSH_EVERY' not in sh
                  assert b'SOTC_RB_AHEAD=' not in sh
                  assert b'case "$SOTC_RB_STREAM_MAX_KB" in 512|1024)' in sh
                  assert b'SOTC_VM_RANGE_CACHE=${SOTC_VM_RANGE_CACHE:-1}' in sh
          print('PASS: original 0.1.34 native binaries, four opt-in tests OFF, signed 0.1.39 APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-of-the-Colossus-Daedalus-Android-Bionic-0.1.39-base034-four-optin
          path: |
            out/release/Shadow-of-the-Colossus-Daedalus-Android-0.1.39-base034-four-optin-arm64.apk
            out/release/Shadow-of-the-Colossus-Daedalus-Android-0.1.39-base034-four-optin-arm64.apk.sha256
            out/release/sotc-native-identical-0.1.39.json
          retention-days: 14
          if-no-files-found: error
