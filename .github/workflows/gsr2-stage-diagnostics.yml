name: GSR2 Stage Correlation (Experimental)

on:
  push:
    branches:
      - research/2.1.7-gsr2-srgb-stage-isolation-20261020
      - fix/2.1.7-gsr2-camera-reacquisition-20261020
    paths:
      - '.github/gsr2-stage-ci-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify GSR2 gamma, stages, exact generation and safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_android_gsr2_*.py' -v
          python3 -m unittest discover -s tests -p 'test_bionic_gsr2_camera_reacquisition.py' -v
          python3 -m unittest discover -s tests -p 'test_bionic_gsr2_videoout_source.py' -v
          python3 -m unittest discover -s tests -p 'test_bionic_gsr2_direct_videoout_presets.py' -v
          python3 -m unittest discover -s tests -p 'test_android_fex_noexec_regression.py' -v
          python3 -m unittest discover -s tests -p 'test_android_launcher_i18n_217.py' -v
          python3 -m unittest discover -s tests -p 'test_android_release_2_1_7.py' -v
          # Compile-free gate for *all* historical R6-R19 Bionic regressions.
          # Do not spend a full ARM64 build on tests that assume obsolete
          # hardcoded spatial-only GSR2 behavior.
          python3 -m unittest discover -s tests -p 'test_bionic_*.py' -v
          python3 -m compileall -q tools/diagnostics/gsr2_stage_compare.py
