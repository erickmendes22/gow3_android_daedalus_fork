name: SotC AOT on-device launcher and compiler export
on:
  push:
    branches: [experiment/sotc-arm64-aot-no-tso-055]
    paths:
      - 'android-launcher/app/src/main/java/com/gow3/android/**'
      - 'android-launcher/app/build.gradle.kts'
      - '.github/workflows/sotc-aot-on-device-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK and add required platform
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Missing Android SDK on GitHub runner}"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-37' 'build-tools;35.0.0'
      - name: Stage executable native bb-recomp (Android W^X safe)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o /tmp/bb-recomp-android-aarch64.tar.xz https://github.com/ducvd89/Bloodborne-android-rebuild-tool/releases/download/v1.3.0/bb-recomp-android-aarch64.tar.xz
          echo 'e0598aebe5b148419d06484e2f02aa19a2a2743915cfdd87a45da814f34d0681  /tmp/bb-recomp-android-aarch64.tar.xz' | sha256sum -c
          mkdir -p out/bionic/apk-jni/arm64-v8a
          tar -xOJf /tmp/bb-recomp-android-aarch64.tar.xz android/libbbrecomp.so > out/bionic/apk-jni/arm64-v8a/libbbrecomp.so
          file out/bionic/apk-jni/arm64-v8a/libbbrecomp.so
      - name: Compile APK user interface
        run: |
          set -euo pipefail
          chmod +x android-launcher/gradlew
          android-launcher/gradlew -p android-launcher :app:assembleRelease -PsotcAndroid=true --no-daemon --max-workers=2
          find android-launcher/app/build/outputs/apk/release -name '*.apk' -ls
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-aot-ondevice-ui-0.1.55-unsigned
          path: android-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Android ARM64 compiler v1.3.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o bb-recomp-android-aarch64.tar.xz https://github.com/ducvd89/Bloodborne-android-rebuild-tool/releases/download/v1.3.0/bb-recomp-android-aarch64.tar.xz
          echo 'e0598aebe5b148419d06484e2f02aa19a2a2743915cfdd87a45da814f34d0681  bb-recomp-android-aarch64.tar.xz' | sha256sum -c
          tar -tJf bb-recomp-android-aarch64.tar.xz | head -70 || true
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-aot-ondevice-compiler-1.3.0
          path: |
            bb-recomp-android-aarch64.tar.xz
            ports/sotc/android/run-sotc-bionic.sh
            ports/sotc/android/aot/compile_local.py
            ports/sotc/android/aot/select_local_aot.py
            ports/sotc/android/aot/stage_on_device_compiler.py
          retention-days: 7
          if-no-files-found: error
