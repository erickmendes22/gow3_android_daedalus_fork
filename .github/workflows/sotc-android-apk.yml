name: SotC Android ARM64 Bionic boot-test APK
on:
  push:
    branches: [sotc-apk-integration]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sotc-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build SotC FEX Bionic, verify original Vulkan ABI, package independent APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOW3_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: AjncSystem/ShadowOfTheColossus-PC
          ref: 27f376d602cefad357299295fa51edad587272d5
          path: upstream-sotc
          submodules: recursive
      - name: Validate SotC-specific packaging scripts before native compilation
        run: |
          python3 -m py_compile ports/sotc/android/stage_renderer.py ports/sotc/android/stage_srt_arm64.py ports/sotc/android/stage_adreno_wave32.py ports/sotc/android/wire_ahb.py ports/sotc/android/package_sotc_runtime.py
          bash -n ports/sotc/android/run-sotc-bionic.sh
          # Compile and execute the portable SRT ABI and guest-memory tests
          # before the expensive FEX and Vulkan build.
          clang++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic \
            tests/test_sotc_arm64_srt.cpp -o "$RUNNER_TEMP/sotc-srt-portable"
          "$RUNNER_TEMP/sotc-srt-portable"
          # Fast native ABI test: numeric SotC NIDs must route to real HLE
          # functions, not an unsupported-import sentinel.
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I. -Isrc -pthread -c src/runtime.c -o "$RUNNER_TEMP/sotc-runtime-imports.o"
          # runtime_mutex.c already defines _GNU_SOURCE itself; defining it
          # again on the command line is a warning promoted to error.
          cc -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I. -Isrc -pthread -c src/runtime_mutex.c -o "$RUNNER_TEMP/sotc-mutex-imports.o"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wl,--gc-sections -pthread \
            tests/test_sotc_scoped_mutex.c "$RUNNER_TEMP/sotc-runtime-imports.o" \
            "$RUNNER_TEMP/sotc-mutex-imports.o" -o "$RUNNER_TEMP/sotc-scoped-mutex"
          "$RUNNER_TEMP/sotc-scoped-mutex"
          # Native staging is cheap; run it before rebuilding FEX to catch
          # source-transformation errors without a long failed job.
          python3 ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          python3 ports/sotc/android/wire_ahb.py --root . --gpu out/sotc-android/gpu
          grep -Fq '#ifndef __ANDROID__' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp
          grep -Fq 'SotcUnusedDesktopVkFunction' out/sotc-android/gpu/third_party/imgui/backends/imgui_impl_vulkan.cpp
          srt=out/sotc-android/gpu/shadps4/shader_recompiler/ir/passes
          grep -Fq 'SotcArm64Srt::Run' "$srt/flatten_extended_userdata_pass.cpp"
          grep -Fq 'NeedsShaderDynamicOffset' "$srt/flatten_extended_userdata_pass.cpp"
          grep -Fq 'IR::Opcode::Phi' "$srt/flatten_extended_userdata_pass.cpp"
          grep -Fq 'UseAdrenoWave32()' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_instance.h
          grep -Fq 'if (UseAdrenoWave32()) return 32u;' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_instance.h
          grep -Fq 'SotC Adreno Wave32' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -Fq 'OpCopyWindow' "$srt/flatten_extended_userdata_pass.cpp"
          grep -Fq 'CopyFlatbufPlacement' "$srt/flatten_extended_userdata_pass.cpp"
          grep -Fq 'SrtWalkerCode(walker_func)' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.cpp
          ! grep -Fq 'FlattenExtendedUserdataPass unimplemented for target architecture.' "$srt/flatten_extended_userdata_pass.cpp"
          python3 ports/sotc/android/check_imgui_loader.py out/sotc-android/gpu/third_party/imgui/backends/imgui_impl_vulkan.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install ARM64 compiler, SDK and build dependencies
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake clang lld pkg-config patchelf glslang-tools \
            make curl tar zip unzip ccache
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - uses: actions/cache/restore@v4
        id: sotc-apk-deps
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
          key: sotc-apk-native-r29-${{ hashFiles('tools/android/bionic/build_deps.sh', 'ci/environment.yml') }}
      - name: Build FEX guest CPU and GoW3-compatible Android platform bridge
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          bash tools/android/bionic/build_deps.sh
          bash tools/android/bionic/build_runtime.sh
          bash tools/android/bionic/build_python.sh
          bash tools/android/bionic/build_pkg.sh
      - name: Build original SotC Vulkan renderer with corrected Android AHB staging
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # This renderer embeds FidelityFX sources as a git submodule; missing
          # sources used to fail in CMake after building FEX for ~10 minutes.
          test -s upstream-sotc/gpu/third_party/fsr-vulkan/src/ffx_vk_fsr3_3_1_6_framegen.cpp ||
            { echo "::error::Missing SotC fsr-vulkan submodule; verify recursive checkout"; exit 1; }
          python3 ports/sotc/android/stage_renderer.py --upstream upstream-sotc --out out/sotc-android/gpu
          python3 ports/sotc/android/wire_ahb.py --root . --gpu out/sotc-android/gpu
          grep -Fq '#ifndef __ANDROID__' out/sotc-android/gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp
          prefix="$PWD/.local-deps/android/bionic-prefix"
          ndk="$GOW3_NDK"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          atomic="$("$llvm/bin/aarch64-linux-android30-clang" -print-file-name=libatomic.a)"
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH CMAKE_PREFIX_PATH
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          cmake -S out/sotc-android/gpu -B out/sotc-android/cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBB_PGO=off -DBB_LTO=OFF \
            -DCMAKE_FIND_ROOT_PATH="$prefix" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -Dpkgcfg_lib_FFMPEG_atomic:FILEPATH="$atomic" \
            "-DCMAKE_PREFIX_PATH=$prefix;$CONDA_PREFIX"
          cmake --build out/sotc-android/cmake --target bbgpu --parallel "$GOW3_JOBS"
          test -s out/sotc-android/cmake/libbbgpu.so
          # Avoid an early-closing grep pipe: llvm-nm can exit 74 on EPIPE.
          "$llvm/bin/llvm-readelf" -h out/sotc-android/cmake/libbbgpu.so > out/sotc-android/cmake/elf-header.txt
          grep -Fq AArch64 out/sotc-android/cmake/elf-header.txt
          "$llvm/bin/llvm-nm" -D --defined-only out/sotc-android/cmake/libbbgpu.so > out/sotc-android/cmake/elf-exports.txt
          grep -Fwq bbgpu_init out/sotc-android/cmake/elf-exports.txt
      - uses: actions/cache/save@v4
        if: always() && steps.sotc-apk-deps.outputs.cache-hit != 'true'
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
          key: sotc-apk-native-r29-${{ hashFiles('tools/android/bionic/build_deps.sh', 'ci/environment.yml') }}
      - name: Check all SotC HLE imports resolve from the FEX main executable
        run: |
          python3 ports/sotc/android/verify_sotc_link.py \
            --ndk "$GOW3_NDK" \
            --renderer out/sotc-android/cmake/libbbgpu.so \
            --probe out/bionic/bin/gow3-probe
          python3 tools/android/bionic/verify_bionic.py \
            --ndk "$GOW3_NDK" --root out/bionic --complete
      - name: Create independent SotC Android game runtime and APK
        run: |
          python3 ports/sotc/android/package_sotc_runtime.py \
            --ndk "$GOW3_NDK" --upstream upstream-sotc \
            --renderer out/sotc-android/cmake/libbbgpu.so
          tar -tzf out/release/sotc-runtime.tar.gz > "$RUNNER_TEMP/sotc-payload-files.txt"
          grep -Fq 'sotcport/run-sotc-bionic.sh' "$RUNNER_TEMP/sotc-payload-files.txt"
          grep -Fq 'sotcport/sotc.default.ini' "$RUNNER_TEMP/sotc-payload-files.txt"
          grep -Fq 'sotcport/arm64/bin/sotc-probe' "$RUNNER_TEMP/sotc-payload-files.txt"
          if grep -Fq 'God_of_War_III_Remastered.xml' "$RUNNER_TEMP/sotc-payload-files.txt"; then
            echo "::error::SotC package includes GoW3 game patches"; exit 1
          fi
          if grep -q '^gow3port/' "$RUNNER_TEMP/sotc-payload-files.txt"; then
            echo "::error::SotC package still uses the GoW3 game data directory"; exit 1
          fi
          chmod +x android-launcher/gradlew
          android-launcher/gradlew -p android-launcher :app:assembleRelease \
            -PsotcAndroid=true --no-daemon --max-workers=2
          bash ports/sotc/android/sign_sotc_apk.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Shadow-of-the-Colossus-Daedalus-Android-Bionic-0.1.6-boot-test
          path: |
            out/release/Shadow-of-the-Colossus-Daedalus-Android-0.1.6-boot-test-arm64.apk
            out/release/Shadow-of-the-Colossus-Daedalus-Android-0.1.6-boot-test-arm64.apk.sha256
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sotc-android-apk-build-diagnostics
          path: |
            out/bionic/CMakeFiles/CMakeConfigureLog.yaml
            out/bionic/logs
            .local-deps/android/bionic-build/*.log
            out/release/sotc-badging.txt
          if-no-files-found: ignore
