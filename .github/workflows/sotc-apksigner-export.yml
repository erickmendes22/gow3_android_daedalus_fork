name: Export Android build-tools APK signer for local signing
on:
  push:
    branches: [experiment/sotc-arm64-aot-no-tso-055]
    paths: ['.github/workflows/sotc-apksigner-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare build-tools v35 for APK v2/v3 offline signing
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          bt="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$bt/apksigner"
          test -f "$bt/lib/apksigner.jar"
          test -x "$bt/zipalign"
          mkdir -p build-tools-offline/lib
          cp "$bt/apksigner" "$bt/zipalign" build-tools-offline/
          cp "$bt/lib/apksigner.jar" build-tools-offline/lib/
          sudo apt-get update -qq
          sudo apt-get install -y libc++1 libc++abi1 libunwind-14
          cxx=$(ldconfig -p | awk '/libc\+\+\.so\.1 / {print $NF; exit}')
          test -s "$cxx"
          cp -L "$cxx" build-tools-offline/libc++.so
          abi=$(ldconfig -p | awk '/libc\+\+abi\.so\.1 / {print $NF; exit}')
          test -s "$abi"
          cp -L "$abi" build-tools-offline/libc++abi.so.1
          unwind=$(ldconfig -p | awk '/libunwind\.so\.1 / {print $NF; exit}')
          if [ -n "$unwind" ] && [ -s "$unwind" ]; then cp -L "$unwind" build-tools-offline/libunwind.so.1; fi
          echo 'Ship libc++ runtime to run zipalign on minimal Linux hosts'
          tar -czf build-tools-android-signing-linux.tar.gz -C build-tools-offline .
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-zipalign-linux-35
          path: build-tools-android-signing-linux.tar.gz
          retention-days: 3
