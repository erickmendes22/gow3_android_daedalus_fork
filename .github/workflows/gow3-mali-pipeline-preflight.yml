name: GoW3 Mali hypotheses - preflight only (no APK)

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/gow3-mali-pipeline-preflight-20261105
    paths:
      - 'benchmarks/**'
      - 'tests/test_mali_draw_perf_gate.py'
      - '.github/workflows/gow3-mali-pipeline-preflight.yml'

permissions:
  contents: read

jobs:
  pipeline-cache-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native Vulkan development headers and software ICD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libvulkan-dev libvulkan1 mesa-vulkan-drivers
      - name: Compile and run real Vulkan worker-cache, merge and restore experiment
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            benchmarks/mali_pipeline_cache_lifecycle.cpp -lvulkan \
            -o /tmp/gow3_mali_pipeline_cache_preflight
          /tmp/gow3_mali_pipeline_cache_preflight
      - name: Check mathematical tests for the rejected image-free-draw hypothesis
        run: |
          python3 -m unittest discover -s tests -p 'test_mali_draw_perf_gate.py' -v
      - name: Report rejected image-free-draw benchmark WITHOUT APK gate override
        run: |
          python3 benchmarks/mali_draw_perf_gate.py --report-only
      - name: Confirm this workflow never builds or packages an APK
        run: |
          if grep -E '^[[:space:]]+run:.*(gradle|assemble|apk)' \
            .github/workflows/gow3-mali-pipeline-preflight.yml; then
            echo 'Unexpected Android build command' >&2
            exit 1
          fi
          echo 'No Android build or APK packaged.'
