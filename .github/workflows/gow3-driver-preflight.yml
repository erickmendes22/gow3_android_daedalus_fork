name: GoW3 Java driver preflight (no APK)
on:
  push:
    branches: [fix/2.1.7-gsr2-spatial-only-all-resolutions-20261030]
    paths:
      - 'tests/test_android_driver_manager.py'
      - '.github/workflows/gow3-driver-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production driver manager with minimal Android fixtures
        run: python -m unittest discover -s tests -p test_android_driver_manager.py -v
