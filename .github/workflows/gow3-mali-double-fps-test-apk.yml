name: GoW3 Mali R16 - save menu composition, DMA safety and transfer accounting

on:
  push:
    branches: [perf/gow3-mali-piston-panvk-v4-20261125]
    paths:
      - '.github/workflows/gow3-mali-double-fps-test-apk.yml'
      - 'gpu/**'
      - 'cpu/**'
      - 'src/**'
      - 'tools/android/**'
      - 'android-launcher/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gow3-mali-double-fps-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOW3_JOBS: '2'
      GOW3_BUILD_TOOLS: '36.0.0'
      GOW3_MALI_TEST_APK: '1'
      GOW3_MALI_ONLY_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - name: Verify consolidated root-cause fixes, test app identity and shader cache ABI
        run: |
          set -euo pipefail
          test -s tools/android/debug/gow3-debug.keystore
          # CI fallback for intermittent Maven Central misses on published Kotlin BOMs.
          grep -q 'maven.aliyun.com/repository/central' android-launcher/settings.gradle.kts
          grep -q 'com.gow3.android.bionic.malitest' android-launcher/app/build.gradle.kts
          grep -q 'GOW3_MALI_GC_BATCH_DOWNLOAD' gpu/shadps4/video_core/texture_cache/texture_cache.cpp
          grep -q 'gc_pending_reclaim' gpu/shadps4/video_core/texture_cache/texture_cache.cpp
          grep -q 'GOW3_MALI_VMA_DRIVER_CALL' gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -q 'MaliTimedAllocateMemory' gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -q 'GOW3_MALI_GPU_EARLY_Z' tools/android/bionic/run-bionic.sh
          grep -q 'MaliEarlyZ::Transform' gpu/shadps4/video_core/renderer_vulkan/vk_shader_util.cpp
          grep -q 'GOW3_MALI_MULTI_COPY_PANVK' gpu/shadps4/video_core/renderer_vulkan/vk_shader_hle.cpp
          grep -q 'descriptor_set' gpu/shadps4/video_core/renderer_vulkan/vk_shader_hle.cpp
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 -Igpu/third_party/sirit/externals/SPIRV-Headers/include tests/test_mali_gpu_early_z.cpp -o /tmp/gow3-mali-early-z
          /tmp/gow3-mali-early-z
          test -x tools/android/bionic/run-bionic.sh
          regression_failures=0
          python3 -m unittest discover -s tests -p 'test_mali_gc_batch_download.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_gpu_tick_priority.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_texture_cache_crash.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_submit_throttle_r6.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_gpu_fault_drain.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_beta3_ports.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_r9_native_batch.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_r10_priorities.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_cpu_present_source.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_present_source_resolution.py' -v || regression_failures=$((regression_failures + 1))
          c++ -std=c++20 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_mali_beta3_copy_policy.cpp -o /tmp/gow3-beta3-copy-policy
          /tmp/gow3-beta3-copy-policy
          c++ -std=c++20 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_mali_gpu_fault_drain.cpp -o /tmp/gow3-gpu-fault-drain
          /tmp/gow3-gpu-fault-drain
          python3 -m unittest discover -s tests -p 'test_android_readback_affinity.py' -v || regression_failures=$((regression_failures + 1))
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_readback_queue.cpp -o /tmp/gow3-readback-queue
          /tmp/gow3-readback-queue
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_mali_index_bind_policy.cpp -o /tmp/gow3-index-bind
          /tmp/gow3-index-bind
          python3 -m unittest discover -s tests -p 'test_mali_vma_block_policy.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_read_only_image_barriers.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_vertex_input_bind_cache.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_uniform_buffer_port.py' -v || regression_failures=$((regression_failures + 1))
          # Prevent distributing an APK with silent storage-image writes or
          # merged driver trace lines. Unit tests above check these invariants;
          # keep independent preflight assertions in the release packaging job.
          grep -q 'feature_flags |= vk::FormatFeatureFlagBits2::eStorageImage;' gpu/shadps4/video_core/texture_cache/image.cpp
          grep -q '!info.props.needs_storage' gpu/shadps4/video_core/texture_cache/image.cpp
          grep -q 'GOW3_MALI_VMA_DRIVER_CALL' gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          python3 -m unittest discover -s tests -p 'test_mali_afbc_color_rt.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_causal_counts.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_scene_image_retention.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_background_warmup.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_format_capabilities_vs_runtime.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_snorm10_vma_prewarm.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_directmem_scalar_fex.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_bcn_to_etc2.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_async_ahb.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_g720_driver_2631_isolated.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_mali_panvk_safe_mode.py' -v || regression_failures=$((regression_failures + 1))
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 \
            tests/test_mali_buffer_barrier_regions.cpp -o /tmp/gow3-mali-barrier-regions
          /tmp/gow3-mali-barrier-regions
          grep -q 'GOW3_UBO=${GOW3_UBO:-2}' tools/android/bionic/run-bionic.sh
          grep -q 'GOW3_MALI_AFBC_COLOR_RT=${GOW3_MALI_AFBC_COLOR_RT:-1}' tools/android/bionic/run-bionic.sh
          grep -q 'GOW3_MALI_LOCAL_BUFFER_BARRIERS=${GOW3_MALI_LOCAL_BUFFER_BARRIERS:-1}' tools/android/bionic/run-bionic.sh
          grep -q 'GOW3_MALI_ASYNC_PRESENT=${GOW3_MALI_ASYNC_PRESENT:-1}' tools/android/bionic/run-bionic.sh
          grep -q 'PANVK_KBASE_GPU_SEMAPHORE_WAITS=${PANVK_KBASE_GPU_SEMAPHORE_WAITS:-0}' tools/android/bionic/run-bionic.sh
          grep -q 'PANVK_KBASE_SKIP_HEAP_OPS=${PANVK_KBASE_SKIP_HEAP_OPS:-0}' tools/android/bionic/run-bionic.sh
          grep -q 'static bool WriteMaliCaptureBmp' gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp
          grep -q 'void Presenter::MaliCpuPresentWorker' gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp
          grep -q 'AsyncQueueDelay' gpu/shadps4/video_core/renderer_vulkan/vk_mali_perf_stats.h
          grep -q 'GOW3_MALI_SHADER_CACHE status=new-profile' gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.cpp
          grep -q 'if (type == BlobType::ShaderProfile)' gpu/shadps4/video_core/cache_storage.cpp
          grep -q 'std::filesystem::exists(path, ec)' gpu/shadps4/video_core/cache_storage.cpp
          grep -q 'matches_profile(candidate.path() / "profile.bin")' gpu/shadps4/video_core/cache_storage.cpp
          grep -q 'return previous == current;' gpu/shadps4/video_core/cache_storage.cpp
          grep -q 'GOW3_MALI_FORMAT_RUNTIME guest=' gpu/shadps4/video_core/texture_cache/image.cpp
          grep -q 'GOW3_MALI_SNORM10_FALLBACK' gpu/shadps4/video_core/texture_cache/image.cpp
          grep -Fq 'layout(local_size_x = 8, local_size_y = 8)' gpu/shadps4/video_core/host_shaders/snorm2101010.comp
          grep -Fq 'gl_GlobalInvocationID.xy' gpu/shadps4/video_core/host_shaders/snorm2101010.comp
          grep -Fq 'uint input_word =' gpu/shadps4/video_core/host_shaders/snorm2101010.comp
          grep -Fq 'uint output_word =' gpu/shadps4/video_core/host_shaders/snorm2101010.comp
          grep -Fq 'maxComputeWorkGroupCount[1]' gpu/shadps4/video_core/renderer_vulkan/vk_runtime.cpp
          grep -q 'add_host_shader(snorm2101010.comp snorm2101010_comp)' gpu/shadps4/video_core/host_shaders/CMakeLists.txt
          grep -q 'add_host_shader(snorm2101010.comp snorm2101010_comp)' gpu/CMakeLists.txt
          grep -q 'eR16G16B16A16Snorm' gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -Fq 'guest_cpu_mark_direct_memory_scalar_return(void* fn)' cpu/guest_cpu_fex.cpp
          grep -q 'PrewarmMaliImagePool' gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -q 'guest_cpu_mark_direct_memory_scalar_return' cpu/guest_cpu_fex.cpp
          grep -q 'GOW3_UBO_DEVICE' gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -q 'uniform_buffer_masks' gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.h
          python3 -m unittest discover -s tests -p 'test_mali_bcn_to_etc2.py' -v || regression_failures=$((regression_failures + 1))
          python3 -m unittest discover -s tests -p 'test_android_*.py' || regression_failures=$((regression_failures + 1))
          python3 -m compileall -q tools/android/bionic scripts
          "$ANDROID_HOME/build-tools/$GOW3_BUILD_TOOLS/aapt2" compile --dir android-launcher/app/src/main/res -o "$RUNNER_TEMP/resources.zip"
      - name: Verify launcher compilation
        run: |
          bash android-launcher/gradlew -p android-launcher :app:compileReleaseJavaWithJavac :app:testReleaseUnitTest --tests com.gow3.android.GameSfoTest -Pgow3Bionic=true -Pgow3MaliTest=true -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --no-daemon --max-workers=2
      - name: Build Android Python for patch validators
        run: GOW3_NDK="$ANDROID_HOME/ndk/29.0.14206865" bash tools/android/bionic/build_python.sh
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Host headers and native toolchain
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          echo "GOW3_BIONIC_HEADERS=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Compile Mali SNORM10 shader to SPIR-V before native link
        shell: bash -el {0}
        run: |
          glslang --target-env vulkan1.3 --vn SNORM2101010_COMP \
            -o "$RUNNER_TEMP/snorm2101010_comp.h" \
            gpu/shadps4/video_core/host_shaders/snorm2101010.comp
          test -s "$RUNNER_TEMP/snorm2101010_comp.h"
          grep -Fq SNORM2101010_COMP "$RUNNER_TEMP/snorm2101010_comp.h"
      - name: Build pinned Android dependencies
        shell: bash -el {0}
        run: bash tools/android/bionic/build_deps.sh
      - name: Compile staging pressure-reclaim translation unit first (real Android NDK)
        shell: bash -el {0}
        run: |
          bash tools/android/bionic/build_gpu.sh --configure-only
          cmake --build out/bionic/gpu --parallel "$GOW3_JOBS" --target \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_instance.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_pipeline_common.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_rasterizer.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_runtime.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/texture_cache/texture_cache.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/texture_cache/image.cpp.o \
            CMakeFiles/gow3gpu.dir/shadps4/video_core/renderer_vulkan/vk_semaphore.cpp.o
      - name: Build Vulkan C++ runtime and CPU runtime (NOT reuse old binaries)
        shell: bash -el {0}
        run: |
          bash tools/android/bionic/build_runtime.sh
          test -s out/bionic/lib/libgow3gpu.so
          test -s out/bionic/lib/libgow3cpu.so
      # Mali-only packaging excludes Bloodframe; its private DXBC submodule is
      # not needed, and trying to fetch it would make this build fail.
      - name: Build Android PKG extractor
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash tools/android/bionic/build_pkg.sh
      - name: Package, sign, and validate separate Mali diagnostics app
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash tools/android/bionic/build_apk.sh --package-only
          test -s out/release/God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk
          test -s out/release/God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk.sha256
          test -s out/android-release/assets/drivers/Bachata-PanVK-V4-0.2.6.zip.sha256
          test -s out/android-release/assets/drivers/Mesa.26.3.0-panvk.8.zip
          test -s out/android-release/assets/drivers/mali-panvk-27.0.0-devel-r10.zip
          test -s out/android-release/assets/drivers/mali-performance-drivers.json
          python3 -m unittest discover -s tests -p 'test_mali_performance_bundle.py' -v || regression_failures=$((regression_failures + 1))
          if [ "$regression_failures" -ne 0 ]; then echo "::error::$regression_failures regression suites failed"; exit 1; fi
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          apk=Path('out/release/God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk')
          drivers=json.loads(Path('out/android-release/assets/drivers/mali-performance-drivers.json').read_text())
          with zipfile.ZipFile(apk) as z:
              for d in drivers:
                  asset='assets/drivers/'+d['file']
                  assert hashlib.sha256(z.read(asset)).hexdigest()==d['sha'], asset
              assert 'assets/drivers/Bachata-PanVK-V4-0.2.6.zip' in z.namelist()
          PY
          (cd out/release && sha256sum -c God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: GoW3-Mali-1023daf52-GPU-TICK-PRIORITY
          path: |
            out/release/God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk
            out/release/God-of-War-III-Mali-Diagnostic-v2.1.8-arm64.apk.sha256
            out/android-release/assets/drivers/Bachata-PanVK-V4-0.2.6.zip.sha256
            out/android-release/assets/drivers/mali-performance-drivers.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: God-of-War-III-Mali-Bachata-V3-Async-AHB-Build-Diagnostics
          path: |
            .local-deps/android/bionic-build/**/*.log
            out/bionic/gpu/CMakeFiles/CMakeConfigureLog.yaml
            android-launcher/app/build/outputs/logs/
          if-no-files-found: ignore
