name: SotC KGSL GPU utilization diagnostics - compile check
on:
  push:
    branches: [diag/sotc-048-kgsl-gpu-logs-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: Compile Android KGSL telemetry (no runtime modifications)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Native C/JNI syntax and attribution check
        run: |
          set -euo pipefail
          grep -Fq 'SPDX-License-Identifier: GPL-3.0-only' android-launcher/app/src/main/cpp/gpuusage/kgsl_busy.c
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function \
            -DKGSL_BUSY_NO_JNI -pthread -fsyntax-only \
            android-launcher/app/src/main/cpp/gpuusage/kgsl_busy.c
          grep -Fq 'sotc_kgsl_utilization_log' android-launcher/app/src/main/java/com/gow3/android/ui/SotcScreen.kt
          grep -Fq 'kgsl-gpu-utilization-' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/SotcGpuUsageLogger.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 37, CMake and NDK
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake
      - name: Compile Kotlin, Java and SotC JNI (no full game runtime)
        run: |
          chmod +x android-launcher/gradlew
          android-launcher/gradlew -p android-launcher \
            :app:compileReleaseJavaWithJavac :app:externalNativeBuildRelease \
            -PsotcAndroid=true --no-daemon --max-workers=2
          find android-launcher/app -name libgpuusage.so -size +1k -print -quit | grep -q libgpuusage.so
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SotC-KGSL-telemetry-native-compiled
          path: |
            android-launcher/app/build/intermediates/cxx/**/obj/arm64-v8a/libgpuusage.so
          retention-days: 14
          if-no-files-found: warn
