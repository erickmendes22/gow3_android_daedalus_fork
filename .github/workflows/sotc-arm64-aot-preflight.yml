name: SotC ARM64 AOT NO-TSO preflight (no FEX APK changes)
on:
  push:
    branches: [experiment/sotc-arm64-aot-no-tso-055]
    paths:
      - "ports/sotc/android/aot/**"
      - "tests/test_sotc_arm64_aot_bootstrap.py"
      - "tests/test_sotc_aot_guest_context.py"
      - "tests/test_sotc_aot_cmdline.py"
      - "tests/test_sotc_aot_integration.py"
      - "tests/test_sotc_aot_android_mksh.py"
      - "ports/sotc/android/aot/verify_compiler.py"
      - "tests/test_sotc_bbrecomp_lowering_patch.py"
      - "tests/test_sotc_pcmpistr_x86_oracle.py"
      - "ports/sotc/android/package_sotc_runtime.py"
      - "src/probe.c"
      - "android-launcher/app/src/main/java/ro/cobrabm/fexdroid/RuntimeInstaller.java"
      - "ports/sotc/android/run-sotc-bionic.sh"
      - ".github/workflows/sotc-arm64-aot-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks (no game or compiler files)
        run: |
          set -euo pipefail
          python3 -m py_compile ports/sotc/android/aot/compile_local.py ports/sotc/android/aot/port_guest_context.py tests/test_sotc_arm64_aot_bootstrap.py tests/test_sotc_aot_guest_context.py
          python3 -m py_compile ports/sotc/android/aot/cmdline_image.py tests/test_sotc_aot_cmdline.py
          python3 -m py_compile ports/sotc/android/package_sotc_runtime.py ports/sotc/android/aot/select_local_aot.py ports/sotc/android/aot/verify_libcxx_abi.py
          bash -n ports/sotc/android/run-sotc-bionic.sh
          python3 -m py_compile ports/sotc/android/aot/patch_bbrecomp_lowering.py tests/test_sotc_bbrecomp_lowering_patch.py
          bash -n ports/sotc/android/aot/build_native_cpu.sh
      - name: Guard BBPROBE5 codegen, original game files, patches and NO x86 TSO
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_sotc_arm64_aot_bootstrap.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_aot_guest_context.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_aot_cmdline.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_aot_integration.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_aot_android_mksh.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_bbrecomp_lowering_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_sotc_pcmpistr_x86_oracle.py' -v
          grep -Fq 'AOT_FLAGS = ("--resume-entries", "--no-callee-saved")' ports/sotc/android/aot/compile_local.py
          ! grep -Fq '"--tso"' ports/sotc/android/aot/compile_local.py
          grep -Fq '"aot_execution_integrated":False' ports/sotc/android/aot/compile_local.py
          ! grep -Fq 'TLOU_TSO_NO_TSO=1' ports/sotc/android/aot/compile_local.py
