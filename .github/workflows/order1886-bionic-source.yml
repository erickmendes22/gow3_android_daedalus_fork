name: The Order 1886 - Android Bionic source and ARM64 audit

on:
  push:
    branches: [port/the-order-1886-bionic]
    paths:
      - "the-order-1886-android/**"
      - ".github/workflows/order1886-bionic-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order1886-bionic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Bionic donor staging branch
        uses: actions/checkout@v4
      - name: Assemble exact upstream revision with Android CPU overlay
        run: |
          git clone --filter=blob:none https://github.com/JulioCacko/The-Order-1886_pc.git order-source
          git -C order-source checkout c53cd01d032995fe622033623ab64b4cf6b02233
          python3 the-order-1886-android/scripts/assemble.py --source order-source --output order-android
          python3 the-order-1886-android/scripts/smoke.py order-android
      - name: Verify native x86-64 source syntax after port overlay
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -pthread -Iorder-android -Iorder-android/src \
             -fsyntax-only order-android/src/probe.c order-android/src/runtime.c \
             order-android/src/runtime_thread.c order-android/src/runtime_cpu.c
      - name: Prepare Android NDK r29
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865'
      - name: Cross-compile syntax validation for Bionic ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -Iorder-android -Iorder-android/src \
             -fsyntax-only order-android/src/probe.c order-android/src/runtime.c \
             order-android/src/runtime_thread.c \
             order-android/src/runtime_audio_bionic.c order-android/src/runtime_pad_bionic.c
      - name: Compile Android screen client, driver loader and AHB receiver
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"
          for source in window_android.cpp order1886_present_client.cpp vk_driver_loader.cpp; do
            "$CXX" -std=c++23 -fsyntax-only -Iorder-android/gpu/shim \
              -Iorder-android/gpu/shadps4 -Iorder-android/tools/android/present \
              "order-android/gpu/shim/$source"
          done
          mkdir -p out/order1886/bridge
          "$CC" -std=gnu11 -O2 -fPIC -shared \
            -Iorder-android/tools/android/present \
            -Iorder-android/tools/android/bionic/present \
            order-android/tools/android/bionic/present/order1886present.c \
            -lnativewindow -landroid -llog -ldl \
            -o out/order1886/bridge/liborder1886present.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h out/order1886/bridge/liborder1886present.so
      - name: Publish Android frame receiver
        uses: actions/upload-artifact@v4
        with:
          name: order1886-android-presentation-arm64
          path: out/order1886/bridge/liborder1886present.so
          if-no-files-found: error
      - name: Initialize pinned FEXCore source
        run: git submodule update --init --recursive third_party/FEX
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Configure and compile the Android Bionic FEX CPU bridge
        shell: bash -el {0}
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          cmake -S third_party/FEX -B out/order1886/fex -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_FEX_INCLUDE="$PWD/the-order-1886-android/overlay/cpu/fex_project.cmake" \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_STEAM_SUPPORT=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_ZYDIS=OFF -DTUNE_ARCH=armv8.2-a -DTUNE_CPU=generic \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF
          cmake --build out/order1886/fex --target order1886cpu --parallel 2
          file out/order1886/fex/liborder1886cpu.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h out/order1886/fex/liborder1886cpu.so
      - name: Publish compiled FEX CPU bridge
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: order1886-bionic-fexcore-arm64
          path: out/order1886/fex/liborder1886cpu.so
          if-no-files-found: error
      - name: Publish source-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order1886-android-source-audit
          path: |
            order-android/ANDROID_PORT_MANIFEST.json
            the-order-1886-android/README.md
          if-no-files-found: ignore
