name: SotC bb-recomp with native masked-vector and SSE4.2 lowering
on:
  push:
    branches: [experiment/sotc-arm64-aot-no-tso-055]
    paths:
      - 'ports/sotc/android/aot/patch_bbrecomp_lowering.py'
      - '.github/workflows/sotc-aot-patched-compiler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patched-host-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Set up native build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake zstd libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev pkg-config
      - name: Download official LLVM 23.1.3 release with headers, Clang and LLD
        run: |
          set -euo pipefail
          mkdir -p /tmp/sotc-llvm
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst' -o /tmp/sotc-llvm.tar.zst
          zstd -d --long=31 -c /tmp/sotc-llvm.tar.zst | tar -x -C /tmp/sotc-llvm
          llvm=$(find /tmp/sotc-llvm -name LLVMConfig.cmake -print -quit)
          test -n "$llvm"
          echo "SOTC_LLVM_DIR=$(dirname "$llvm")" >> "$GITHUB_ENV"
          echo "SOTC_LLVM_ROOT=$(dirname "$(dirname "$(dirname "$(dirname "$llvm")")")")" >> "$GITHUB_ENV"
      - name: Clone official pinned bb-recomp and prepare FEX IR frontend
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ducvd89/Bloodborne-android-rebuild-tool.git /tmp/sotc-compiler
          test "$(git -C /tmp/sotc-compiler rev-parse HEAD)" = "6ebb33b0c"$(git -C /tmp/sotc-compiler rev-parse HEAD | cut -c 10-40)
          bash /tmp/sotc-compiler/fetch-fex.sh
          python3 ports/sotc/android/aot/patch_bbrecomp_lowering.py /tmp/sotc-compiler
          grep -F 'case OP_VPCMPISTRX:' /tmp/sotc-compiler/src/lower_vector.cpp
      - name: Build native Linux AOT compiler with full patched LLVM lowering
        run: |
          set -euo pipefail
          compiler=/tmp/sotc-compiler
          cmake -S "$compiler" -B /tmp/sotc-bbrecomp-build -G Ninja \
            -DFEX_SOURCE_DIR="$compiler/out/recomp-fex" \
            -DBB_RECOMP_LLVM=ON -DBB_RECOMP_PLAYER=OFF -DBB_RECOMP_BUNDLED=OFF \
            -DBB_RECOMP_LLVM_DIR="$SOTC_LLVM_DIR" \
            -DBB_RECOMP_CC="$SOTC_LLVM_ROOT/bin/clang" -DBB_RECOMP_CXX="$SOTC_LLVM_ROOT/bin/clang++" \
            -DBB_RECOMP_JOBS=4 -DBB_RECOMP_MARCH=x86-64-v3
          cmake --build /tmp/sotc-bbrecomp-build --parallel 4
          test -x /tmp/sotc-bbrecomp-build/bb-recomp
      - name: Confirm real compiler command line and no x86 TSO
        run: |
          set -euo pipefail
          /tmp/sotc-bbrecomp-build/bb-recomp --help | head -80
          install -Dm755 /tmp/sotc-bbrecomp-build/bb-recomp out/sotc-bb-recomp/bb-recomp
          sha256sum out/sotc-bb-recomp/bb-recomp > out/sotc-bb-recomp/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sotc-bbrecomp-native-vector-sse42-patched-host
          path: out/sotc-bb-recomp/
          retention-days: 5
          if-no-files-found: error
