name: The Order 1886 - Bionic Vulkan renderer build

on:
  push:
    branches: [port/the-order-1886-bionic]
    paths:
      - ".github/workflows/order1886-bionic-gpu.yml"
      - "the-order-1886-android/overlay/gpu/**"
      - "the-order-1886-android/overlay/tools/android/**"
      - "the-order-1886-android/overlay/src/**"
      - "the-order-1886-android/overlay/cpu/**"
      - "the-order-1886-android/scripts/**"
      - "android-launcher/order1886/**"
      - "android-launcher/settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order1886-bionic-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-vulkan-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Order PC renderer with submodules
        run: |
          git clone https://github.com/JulioCacko/The-Order-1886_pc.git order-source
          git -C order-source checkout c53cd01d032995fe622033623ab64b4cf6b02233
          git -C order-source submodule update --init --recursive
          python3 the-order-1886-android/scripts/assemble.py --source order-source --output order-android
          python3 the-order-1886-android/scripts/smoke.py order-android
      - name: Setup Android SDK and NDK r29
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865'
      - name: Prepare host C++ and shader build tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Install host CMake header dependencies
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"
      - name: Cache pinned cross-compiled Bionic dependencies
        id: bionic-deps-cache
        uses: actions/cache@v4
        with:
          path: .local-deps/android/bionic-prefix
          key: order1886-bionic-deps-ndkr29-v1
      - name: Build native Android third-party dependencies
        shell: bash -el {0}
        run: |
          export GOW3_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export GOW3_JOBS=2
          bash tools/android/bionic/build_deps.sh
      - name: Save successful cross-compiled dependencies before GPU configuration
        if: steps.bionic-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .local-deps/android/bionic-prefix
          key: order1886-bionic-deps-ndkr29-v1
      - name: Restore native C++ compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: order1886-gpu-ccache-${{ github.sha }}
          restore-keys: |
            order1886-gpu-ccache-
      - name: Configure and compile Order-specific GPU renderer for Android ARM64
        shell: bash -el {0}
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=1G
          PREFIX="$PWD/.local-deps/android/bionic-prefix"
          HEADERS="$CONDA_PREFIX"
          export PATH="$HEADERS/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          unset PKG_CONFIG_SYSROOT_DIR CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          ATOMIC=$("$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" -print-file-name=libatomic.a)
          test -f "$ATOMIC"
          cmake -S order-android/gpu -B out/order1886/gpu -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DORDER1886_PGO=off -DORDER1886_LTO=OFF \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -Dpkgcfg_lib_FFMPEG_atomic:FILEPATH="$ATOMIC" \
            "-DCMAKE_PREFIX_PATH=$PREFIX;$HEADERS"
          # Collect all compile errors in one run; successful files are cached for reuse.
          cmake --build out/order1886/gpu --target ps4gpu --parallel 2 -- -k 0
          file out/order1886/gpu/libps4gpu.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h out/order1886/gpu/libps4gpu.so
      - name: Save native C++ compiler cache even after source errors
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: order1886-gpu-ccache-${{ github.sha }}
      - name: Publish GPU ARM64 library only when native link passes
        uses: actions/upload-artifact@v4
        with:
          name: order1886-bionic-vulkan-gpu-arm64
          path: out/order1886/gpu/libps4gpu.so
          if-no-files-found: error
      - name: Initialize FEXCore for complete native game runtime
        run: git submodule update --init --recursive third_party/FEX
      - name: Build Bionic ARM64 guest CPU bridge for The Order
        shell: bash -el {0}
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          cmake -S third_party/FEX -B out/order1886/fex -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_FEX_INCLUDE="$PWD/the-order-1886-android/overlay/cpu/fex_project.cmake" \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_STEAM_SUPPORT=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_ZYDIS=OFF -DTUNE_ARCH=armv8.2-a -DTUNE_CPU=generic \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF
          cmake --build out/order1886/fex --target order1886cpu --parallel 2
      - name: Compile and link The Order Android HLE native runtime
        shell: bash -el {0}
        run: |
          export GOW3_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          bash the-order-1886-android/scripts/build_runtime_android.sh order-android out/order1886
      - name: Stage dedicated The Order Android JNI payload
        shell: bash -el {0}
        run: |
          set -euo pipefail
          target=out/order1886/apk-jni/arm64-v8a
          mkdir -p "$target"
          # An Android PIE executable is installed in the APK's executable
          # nativeLibraryDir as an extracted ET_DYN file, not under no-exec app data.
          cp out/order1886/bin/order1886-probe "$target/liborder1886_probe.so"
          cp out/order1886/lib/libps4gpu.so "$target/"
          cp out/order1886/lib/liborder1886cpu.so "$target/"
          cp out/order1886/lib/liborder1886present.so "$target/"
          cp out/order1886/lib/libc++_shared.so "$target/"
          for lib in "$target"/*.so; do
            echo "Native payload: $lib"
            "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep -E 'Class:|Machine:|Type:'
          done
      - name: Set up Java for dedicated The Order APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build dedicated The Order 1886 Android debug APK
        working-directory: android-launcher
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :order1886:assembleDebug --no-daemon --stacktrace
      - name: Verify The Order APK contents and package
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-launcher/order1886/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -f "$apk"
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/liborder1886_probe.so'
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/libps4gpu.so'
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/liborder1886cpu.so'
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/liborder1886present.so'
          echo "Built The Order ARM64 APK: $apk"
          sha256sum "$apk"
      - name: Publish The Order Android Bionic boot-test APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Order-1886-Daedalus-Bionic-Android-0.1.0-boot-test
          path: android-launcher/order1886/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish native game runtime test executables
        uses: actions/upload-artifact@v4
        with:
          name: order1886-bionic-native-runtime-arm64
          path: |
            out/order1886/bin/order1886-probe
            out/order1886/lib/liborder1886cpu.so
            out/order1886/lib/libps4gpu.so
            out/order1886/lib/liborder1886present.so
          if-no-files-found: error
